<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15171A">
<title>Bitácora</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg: #15171A; --bg-card: #1D2024; --bg-raised: #24282D;
    --txt: #F2F0EA; --txt-dim: #9A9EA6; --accent: #B08D57;
    --accent-soft: #3A342A; --line: #2C3036; --danger: #B85C4A; --ok: #5C7A63;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; }
  body { padding-bottom: 40px; min-height: 100vh; }
  button { font-family: 'Inter', sans-serif; cursor: pointer; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .header-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .brand { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; }
  .brand-row { display: flex; align-items: center; gap: 8px; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--txt); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .icon-btn.active { background: var(--accent); color: #15171A; }
  .tab-row { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; }
  .tab { flex: 0 0 auto; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--txt-dim); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tab.active { background: var(--accent); color: #15171A; border-color: var(--accent); }
  .focus-bar { padding: 10px 16px; font-size: 12.5px; color: var(--txt-dim); font-style: italic; border-bottom: 1px solid var(--line); }
  main { padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card-head { display: flex; gap: 8px; align-items: flex-start; }
  .ex-name { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
  .meta-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; }
  .tag-dim { font-size: 11.5px; color: var(--txt-dim); padding: 3px 0; }
  .equip-line { font-size: 11.5px; color: var(--txt-dim); margin-top: 5px; }
  .edit-input { width: 100%; background: var(--bg-raised); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 6px 8px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .edit-input-small { background: var(--bg-raised); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 5px 7px; font-size: 12px; flex: 1; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .log-btn { display: flex; align-items: center; gap: 5px; background: var(--accent); color: #15171A; border: none; border-radius: 8px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; }
  .hist-btn { display: flex; align-items: center; gap: 4px; background: transparent; color: var(--txt-dim); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; }
  .form { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
  .form-row { display: flex; gap: 6px; }
  .input, .input-full { background: var(--bg-raised); border: 1px solid var(--line); color: var(--txt); border-radius: 7px; padding: 8px 9px; font-size: 13px; min-width: 0; }
  .input { flex: 1; }
  .input-full { width: 100%; }
  .unit-toggle { display: flex; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
  .unit-btn { background: var(--bg-raised); color: var(--txt-dim); border: none; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .unit-btn.active { background: var(--accent); color: #15171A; }
  .save-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--ok); color: #F2F0EA; border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 700; margin-top: 2px; width: 100%; }
  .history { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .hist-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--txt-dim); }
  .hist-date { width: 58px; flex-shrink: 0; }
  .hist-val { color: var(--txt); font-weight: 600; flex-shrink: 0; }
  .hist-equip { flex: 1; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-del { background: transparent; border: none; color: var(--txt-dim); padding: 2px; margin-left: auto; }
  .remove-btn { background: transparent; border: none; color: var(--danger); padding: 4px; font-size: 15px; }
  .add-ex-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: transparent; border: 1px dashed var(--line); color: var(--txt-dim); border-radius: 10px; padding: 12px; font-size: 13px; width: 100%; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #15171A; padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,0.4); z-index: 100; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand-row">
      <span style="color: var(--accent); font-size: 20px;">&#9877;</span>
      <span class="brand">Bitácora</span>
    </div>
    <div class="header-actions">
      <input type="file" id="importFile" accept=".xlsx,.xls" class="hidden">
      <button class="icon-btn" id="btnSheets" title="Google Sheets">&#128196;</button>
      <button class="icon-btn" id="btnStats" title="Estadísticas">&#128202;</button>
      <button class="icon-btn" id="btnImport" title="Importar Excel">&#8593;</button>
      <button class="icon-btn" id="btnExport" title="Exportar a Excel">&#8595;</button>
      <button class="icon-btn" id="btnEdit" title="Editar rutina">&#9998;</button>
    </div>
  </div>
  <div class="tab-row" id="tabRow"></div>
</header>

<div class="focus-bar" id="focusBar"></div>
<div class="focus-bar hidden" id="sheetsStatus" style="border-top:1px solid var(--line);"></div>

<div id="sheetsModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:400px;width:100%;">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;margin-bottom:10px;">Google Sheets</div>
    <div id="sheetsModalBody"></div>
  </div>
</div>

<div id="statsModal" class="hidden" style="position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;">
  <div style="position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;">
    <span class="brand">Estadísticas</span>
    <button class="icon-btn" id="statsCloseBtn">&times;</button>
  </div>
  <div id="statsBody" style="padding:16px;max-width:640px;margin:0 auto;"></div>
</div>

<main id="main"></main>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
